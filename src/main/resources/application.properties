spring.application.name=xibalba-data

# Configuración del servidor (Dinámico para Railway)
server.port=${PORT:8080}
server.address=0.0.0.0

# Conexión a la Base de Datos (Nube / Respaldo Local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xibalbadata}
spring.datasource.username=${DB_USER:andres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.keepaliveTime=240000

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE